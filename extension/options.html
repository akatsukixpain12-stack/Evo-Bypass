<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EVO Bypass settings</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app settings">
      <header class="header">
        <div class="logo">E</div>
        <div><p class="brand">EVO BYPASS</p><p class="status"><span></span> Settings</p></div>
      </header>
      <section class="intro">
        <p class="eyebrow">CONNECTION</p>
        <h1>Choose your<br><strong>resolver.</strong></h1>
        <p class="muted">Use localhost for development or point the extension at your hosted EVO API.</p>
      </section>
      <form id="settings-form">
        <label for="api-url">API base URL</label>
        <input id="api-url" class="settings-input" type="url" placeholder="http://localhost:3000" required>
        <button class="save-button" type="submit">Save settings</button>
        <p id="saved" class="saved" role="status"></p>
      </form>
      <footer>Right-click any link and choose “Resolve with EVO Bypass”.</footer>
    </main>
    <script src="options.js"></script>
  </body>
</html>
